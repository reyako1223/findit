<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b7466" />
    <meta name="description" content="FindIt smart offline lost and found matcher" />

    <link rel="stylesheet" href="/src/styles.css" />

        <symbol id="icon-records" viewBox="0 0 24 24"><path d="M6 3h12a2 2 0 0 1 2 2v15a1 1 0 0 1-1.5.86L12 17l-6.5 3.86A1 1 0 0 1 4 20V5a2 2 0 0 1 2-2Zm0 2v12.37l6-3.56 6 3.56V5H6Zm2 3h8v2H8V8Zm0 4h6v2H8v-2Z"/></symbol>

        <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7-1.4-1.4 5.6-5.6-5.6-5.6L9 5Z"/></symbol>
        <symbol id="icon-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7 1.4-1.4-5.6-5.6 5.6-5.6L15 5Z"/></symbol>

        <symbol id="icon-edit" viewBox="0 0 24 24"><path d="m16.9 3.6 3.5 3.5L8.5 19H5v-3.5L16.9 3.6Zm0 2.8L7 16.3V17h.7l9.9-9.9-.7-.7ZM4 21h16v-2H10l-2 2H4Z"/></symbol>

      </defs>
    </svg>

    <div class="app-shell">
      <div id="splash" class="splash" aria-label="FindIt is loading">
        <div class="splash-mark"><svg><use href="#icon-logo"></use></svg></div>
        <h1>FindIt</h1>
        <p>Smart Lost &amp; Found Matcher</p>
        <div class="loading-dots"><span></span><span></span><span></span></div>
      </div>

      <main id="app" class="screen" aria-live="polite"></main>

      <nav id="bottom-nav" class="bottom-nav" aria-label="Main navigation">
        <button type="button" data-nav="home"><svg><use href="#icon-home"></use></svg><span>Home</span></button>
        <button type="button" data-nav="report"><span class="nav-add"><svg><use href="#icon-plus"></use></svg></span><span>Report</span></button>
        <button type="button" data-nav="matches"><svg><use href="#icon-matches"></use></svg><span>Matches</span></button>
        <button type="button" data-nav="records"><svg><use href="#icon-records"></use></svg><span>Records</span></button>
      </nav>

      <div id="modal-root"></div>
      <div id="toast" class="toast" role="status"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
